<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Qteco status</title>
        <link rel="stylesheet" href="css/style.css" />
        <link
            rel="shortcut icon"
            href="images/favicon.ico"
            type="image/x-icon"
        />
        <script src="scripts/dateTime.js"></script>
        <script src="scripts/script.js"></script>
        <script src="scripts/fetchApi.js"></script>
    </head>
    <body onload="startTime(); init()">
        <header class="Qteco">
            <div id="filter">
                <label for="status-filter">Show:</label>
                <select id="status-filter">
                    <option value="all">All</option>
                    <option value="100-199">100–199</option>
                    <option value="200-299">200–299</option>
                    <option value="300-399">300–399</option>
                    <option value="400-499">400–499</option>
                    <option value="500-599">500–599</option>
                </select>
            </div>
            <div class="dateTime" id="time"></div>
            <div>
                <img src="images/logo.svg" />
            </div>
            <div class="dateTime" id="date"></div>
            <div id="theme-container">
                <label for="theme-select">Theme:</label>
                <select id="theme-select">
                    <option value="light" selected>Light</option>
                    <option value="dark">Dark</option>
                </select>
            </div>
        </header>
        <div id="card-container"></div>

            <div class="footUp"></div>
